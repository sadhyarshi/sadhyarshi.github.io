<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadhyarshi Sahastranshu | Coming Soon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --border: #ffffff12;
            --accent: #6c63ff;
            --accent2: #ff6584;
            --text: #e2e2f0;
            --muted: #7a7a9a;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
        }
        .orb-1 { width: 500px; height: 500px; background: rgba(108,99,255,0.15); top: -100px; left: -100px; }
        .orb-2 { width: 400px; height: 400px; background: rgba(255,101,132,0.1); bottom: -80px; right: -80px; }

        .content { position: relative; z-index: 1; padding: 2rem; }

        .logo {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 3rem;
            letter-spacing: -0.5px;
        }
        .logo span { color: var(--accent); }

        h1 {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: clamp(2.5rem, 8vw, 5rem);
            color: #fff;
            letter-spacing: -1.5px;
            margin: 0 0 1rem;
            background: linear-gradient(135deg, #fff, var(--muted));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--muted);
            font-size: 1.05rem;
            max-width: 420px;
            margin: 0 auto 2.5rem;
            line-height: 1.7;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 99px;
            padding: 6px 16px;
            font-size: 0.82rem;
            color: var(--muted);
            margin-bottom: 2rem;
        }
        .hero-badge-dot {
            width: 7px; height: 7px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .contact-link {
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            padding-bottom: 2px;
            transition: border-color 0.2s, color 0.2s;
        }
        .contact-link:hover { color: var(--accent); border-color: var(--accent); }

        footer {
            position: absolute;
            bottom: 1.5rem;
            left: 0;
            right: 0;
            color: var(--muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="content">
        <div class="logo">SS<span>.</span></div>
        <div class="hero-badge">
            <span class="hero-badge-dot"></span>
            Site under construction
        </div>
        <h1>Coming Soon</h1>
        <p>I'm building something new. In the meantime, reach out at
            <a href="mailto:hello@sadhyarshi.com" class="contact-link">hello@sadhyarshi.com</a>
        </p>
    </div>

    <footer>© 2026 Sadhyarshi Sahastranshu. All rights reserved.</footer>
</body>
</html>
